<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quantity Measurement App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- HERO -->
    <section class="hero text-center">
        <h1 class="fw-bold">Quantity Measurement App</h1>
        <p class="text-muted">
            Convert, compare and calculate units easily.
        </p>
    </section>

    <!-- FEATURES -->
    <section class="container my-4">
        <div class="row g-3 justify-content-center">

            <div class="col-md-3">
                <div class="card feature-card length-card text-center">
                    <div class="icon">📏</div>
                    <h5>Length</h5>
                    <p>Kilometre, Metre, Centimetre</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card feature-card weight-card text-center">
                    <div class="icon">⚖️</div>
                    <h5>Weight</h5>
                    <p>Ton, Kilogram, gram</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card feature-card temp-card text-center">
                    <div class="icon">🌡️</div>
                    <h5>Temperature</h5>
                    <p>Celsius, Fahrenheit, Kelvin</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card feature-card volume-card text-center">
                    <div class="icon">🧪</div>
                    <h5>Volume</h5>
                    <p>Liters, Milliliter, Gallons</p>
                </div>
            </div>

        </div>
    </section>

    <!-- MAIN CARD -->
    <section class="container d-flex justify-content-center">
        <div class="converter-card p-4">

            <!-- ACTION -->
            <div class="d-flex justify-content-center gap-1 mb-4">
                <button id="tab-conversion" class="action-btn active">Conversion</button>
                <button id="tab-comparison" class="action-btn">Comparison</button>
                <button id="tab-arithmetic" class="action-btn">Arithmetic</button>
            </div>
            <hr>
            <!-- INPUT -->
            <div class="row align-items-center mb-4">
                <div class="col">
                    <label>FROM</label>
                    <input type="number" id="fromValue" class="form-control mb-2" placeholder="Enter value">
                    <select id="fromUnit" class="form-select"></select>
                </div>
                <div class="col-auto">
                    <i class="bi bi-arrow-right">→</i>
                </div>
                <div class="col">
                    <label>TO</label>
                    <input type="number" id="toValue" class="form-control mb-2" placeholder="Result" readonly>
                    <select id="toUnit" class="form-select"></select>
                </div>
            </div>

            <!-- OPERATOR -->
            <div id="operator-selector" class="mt-3 justify-content-center align-items-center gap-2"
                style="display: none;">
                <label class="fw-bold mb-0">Select Operation:</label>
                <select id="operatorSelect" class="form-select w-auto">
                    <option value="+">Addition (+)</option>
                    <option value="-">Subtraction (-)</option>
                    <option value="*">Multiplication (×)</option>
                    <option value="/">Division (÷)</option>
                </select>
            </div>

            <!-- SUBMIT BUTTON -->
            <div class="text-center mt-3">
                <button id="submitBtn" class="btn btn-success px-4">Submit</button>
            </div>
            <!-- RESULT -->
            <div class="result-panel text-center mt-4 p-3">
                <h4>
                    <span id="result-value">Result will appear here</span>
                    <span id="result-unit" class="ms-1"></span>
                </h4>
            </div>

            <!-- ERROR -->
            <div id="errorBanner" class="alert alert-danger d-none mt-3"></div>

            <!-- HISTORY -->
            <div class="mt-4">
                <h6>History</h6>
                <div id="history"></div>
            </div>

        </div>
    </section>

    <!--  bootstrap script  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script type="module" src="../script/script.js"></script>

</body>

</html>
