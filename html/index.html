<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quantity Measurement App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- HERO -->
    <section class="hero text-center">
        <h1 class="fw-bold">Quantity Measurement App</h1>
        <p class="text-muted">
            Convert, compare and calculate units easily.
        </p>
    </section>

    <!-- FEATURES -->
    <section class="container my-4">
        <div class="row g-3 justify-content-center">

            <div class="col-md-3">
                <div class="card feature-card length-card text-center">
                    <div class="icon">📏</div>
                    <h5>Length</h5>
                    <p>Kilometre, Metre, Centimetre</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card feature-card weight-card text-center">
                    <div class="icon">⚖️</div>
                    <h5>Weight</h5>
                    <p>ton, Kilogram, gram</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card feature-card temp-card text-center">
                    <div class="icon">🌡️</div>
                    <h5>Temperature</h5>
                    <p>Celsius, Fahrenheit, Kelvin</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card feature-card volume-card text-center">
                    <div class="icon">🧪</div>
                    <h5>Volume</h5>
                    <p>Liters, Milliliter, Gallons</p>
                </div>
            </div>

        </div>
    </section>

    <!-- MAIN CARD -->
    <section class="container d-flex justify-content-center">
        <div class="converter-card p-4">

            <!-- ACTION -->
            <div class="text-center mb-3">
                <button class="action-btn active" data-action="conversion">Conversion</button>
                <button class="action-btn" data-action="comparison">Comparison</button>
                <button class="action-btn" data-action="arithmetic">Arithmetic</button>
            </div>

            <hr>

            <!-- INPUT -->
            <div class="row g-3 align-items-center">

                <div class="col-md-5">
                    <label>FROM</label>
                    <input type="number" id="fromValue" class="form-control" placeholder="Enter value">
                    <select id="fromUnit" class="form-select mt-2"></select>
                </div>

                <div class="col-md-2 text-center">
                    <span class="arrow">→</span>
                </div>

                <div class="col-md-5">
                    <label>TO</label>
                    <input type="number" id="toValue" class="form-control" disabled>
                    <select id="toUnit" class="form-select mt-2"></select>
                </div>

            </div>

            <!-- OPERATOR -->
            <div id="operatorRow" class="text-center mt-3">
                <select id="operator" class="form-select w-25 mx-auto">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
            </div>

            <!-- RESULT -->
            <div class="result-box mt-4 text-center">
                <p id="resultText">Result will appear here</p>
            </div>

            <!-- ERROR -->
            <div id="errorBanner" class="alert alert-danger d-none mt-3"></div>

            <!-- HISTORY -->
            <div class="mt-4">
                <h6>History</h6>
                <div id="history"></div>
            </div>

        </div>
    </section>

    <!--  bootstrap script  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script type="module" src="../script/script.js"></script>

</body>

</html>
