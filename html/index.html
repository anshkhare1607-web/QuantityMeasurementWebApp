<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quantity Converter</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <div class="container mt-4">

        <!-- error -->
        <div id="errorBanner" class="alert alert-danger d-none"></div>

        <!-- cards -->
        <div class="mb-3">
            <div class="btn-group">
                <button class="btn btn-outline-primary type-card" data-type="length">Length</button>
                <button class="btn btn-outline-primary type-card" data-type="weight">Weight</button>
                <button class="btn btn-outline-primary type-card" data-type="temperature">Temperature</button>
                <button class="btn btn-outline-primary type-card" data-type="volume">Volume</button>
            </div>
        </div>

        <!-- action buttons -->
        <div class="mb-3">
            <div class="btn-group">
                <button class="btn btn-outline-success action-btn" data-action="conversion">Conversion</button>
                <button class="btn btn-outline-success action-btn" data-action="comparison">Comparison</button>
                <button class="btn btn-outline-success action-btn" data-action="arithmetic">Arithmetic</button>
            </div>
        </div>

        <!-- inputs -->
        <div class="row g-3 align-items-center mb-3">

            <div class="col-md-3">
                <input type="number" id="fromValue" class="form-control" placeholder="Enter value">
            </div>

            <div class="col-md-3">
                <select id="fromUnit" class="form-select"></select>
            </div>

            <div class="col-md-3">
                <select id="toUnit" class="form-select"></select>
            </div>

        </div>

        <!-- operator -->
        <div id="operatorRow" class="mb-3">
            <select id="operator" class="form-select w-25">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
        </div>

        <!-- history -->
        <div class="card">
            <div class="card-header">History</div>
            <div id="history" class="card-body"></div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Your Script -->
    <script type="module" src="../script/script.js"></script>

</body>
</html>
